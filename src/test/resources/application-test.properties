
# =================================
# TEST DATABASE - H2
# =================================
spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:alphabet_universe_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.datasource.hikari.maximum-pool-size=2
spring.sql.init.mode=never

# =================================
# COGNITO TEST CONFIGURATION
# =================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test

aws.cognito.client-id=test-client-id
aws.cognito.domain=https://example.auth.us-east-1.amazoncognito.com
aws.cognito.oauth.allowed-redirect-uris=http://localhost:5173/callback
aws.cognito.oauth.refresh-mode=sdk

# =================================
# FRONTEND AND CORS
# =================================
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# =================================
# AWS TEST CONFIGURATION
# =================================
aws.region=us-east-1
aws.s3.region=us-east-1
aws.s3.bucket=alphabet-universe-test-bucket

# =================================
# EXTERNAL API
# =================================
merriam-webster.api-key=
